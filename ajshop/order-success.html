<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Confirmed — AJ SHOP</title>
<link rel="icon" href="assets/img/logo.svg">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="site-header"></div>

<main class="wrap">
  <div class="co-card" style="max-width:640px;margin:40px auto;text-align:center;padding:44px 30px">
    <div style="width:84px;height:84px;border-radius:50%;background:#e7f8ef;display:flex;align-items:center;justify-content:center;margin:0 auto 20px">
      <svg viewBox="0 0 24 24" width="42" height="42" fill="none" stroke="#1a9d63" stroke-width="2.5"><path d="M20 6 9 17l-5-5"/></svg>
    </div>
    <h1 style="font-size:28px;margin-bottom:8px">Thank you for your order!</h1>
    <p style="color:var(--muted);margin-bottom:8px" id="sub">Your order has been placed successfully.</p>
    <div id="demoNote"></div>
    <div style="background:var(--bg);border-radius:12px;padding:18px;margin:22px 0;text-align:left" id="orderBox"></div>
    <p style="color:var(--muted);font-size:14px;margin-bottom:22px">A confirmation with tracking details has been sent to your email.</p>
    <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
      <a class="btn btn-primary" href="index.html">Continue Shopping</a>
      <a class="btn btn-ghost" href="#">Track Order</a>
    </div>
  </div>
</main>

<div id="site-footer"></div>

<script src="assets/js/art.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
  AJ.mount();
  const q = new URLSearchParams(location.search);
  const method = q.get('method') || 'card';
  const orderId = q.get('order') || '—';
  const labels = { card:'Credit/Debit Card', netbanking:'Net Banking', upi:'UPI', cod:'Cash on Delivery' };

  let order = null;
  try { order = JSON.parse(sessionStorage.getItem('aj_last_order')); } catch {}

  document.getElementById('sub').textContent =
    method==='cod' ? 'Your Cash on Delivery order is confirmed.' : 'Your payment was successful and your order is confirmed.';

  if (q.get('demo')) {
    document.getElementById('demoNote').innerHTML =
      `<p style="font-size:12.5px;color:var(--muted);background:#fff6e6;border:1px solid #ffe0a3;border-radius:8px;padding:8px 12px;display:inline-block;margin-top:6px">
       Demo mode — CCAvenue gateway server not connected. See <code>server/README</code> to enable live payments.</p>`;
  }

  const rows = [
    ['Order ID', orderId],
    ['Payment method', labels[method] || method],
    ['Amount', order ? AJ.money(order.total) : '—'],
    ['Delivery to', order ? `${order.billing_name}, ${order.billing_city}, ${order.billing_state} — ${order.billing_zip}` : '—'],
    ['Estimated delivery', '3–6 business days']
  ];
  document.getElementById('orderBox').innerHTML = rows.map(r =>
    `<div style="display:flex;justify-content:space-between;gap:16px;padding:6px 0;font-size:14px">
       <span style="color:var(--muted)">${r[0]}</span><strong style="color:var(--ink);text-align:right">${r[1]}</strong></div>`).join('');
</script>
</body>
</html>
