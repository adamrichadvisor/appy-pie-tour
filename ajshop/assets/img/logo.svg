    <text x="52" y="38" font-family="'Poppins','Segoe UI',sans-serif" font-weight="800" font-size="34" fill="#e6482e" letter-spacing="0.5">SHOP</text>
    <text x="2" y="58" font-family="'Poppins','Segoe UI',sans-serif" font-weight="500" font-size="11" fill="#7a869a" letter-spacing="3.5">SHOP&#160;SMART&#160;·&#160;LIVE&#160;WELL</text>
