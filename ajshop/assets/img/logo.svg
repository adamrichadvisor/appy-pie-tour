<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 72" role="img" aria-label="AJ Shop">
  <defs>
    <linearGradient id="ajBag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7a3d"/>
      <stop offset="1" stop-color="#e6482e"/>
    </linearGradient>
    <linearGradient id="ajText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2a44"/>
      <stop offset="1" stop-color="#33415c"/>
    </linearGradient>
  </defs>
  <!-- bag mark -->
  <g transform="translate(6,8)">
    <rect x="2" y="16" width="52" height="48" rx="10" fill="url(#ajBag)"/>
    <path d="M16 20v-3a12 12 0 0 1 24 0v3" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <text x="28" y="52" text-anchor="middle" font-family="'Poppins','Segoe UI',sans-serif" font-weight="800" font-size="26" fill="#fff">AJ</text>
  </g>
