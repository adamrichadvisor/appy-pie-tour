<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AJ SHOP</title>
<link rel="icon" href="assets/img/logo.svg">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="site-header"></div>
<main class="wrap">
  <nav class="crumb"><a href="index.html">Home</a><span>›</span><span id="crumbNow">Page</span></nav>
  <div class="info-page" id="page"></div>
</main>
<div id="site-footer"></div>

<script src="assets/js/art.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
AJ.mount();
const PAGES = {
  about: { title:'About AJ SHOP', lead:'Shop smart. Live well.', html:`
    <div class="info-card"><p>AJ SHOP is an everyday online marketplace built to make quality shopping simple and affordable for every Indian household. From kids’ and adults’ clothing to the latest mobiles, electronics, beauty, stationery, computer accessories, handmade crafts, home decor and footwear — we bring ten departments together in one trusted store.</p>
    <p>We started with a simple belief: good products shouldn’t cost a fortune, and buying them online should feel effortless and safe. Every order is backed by secure CCAvenue payments, transparent pricing and pan-India delivery.</p></div>
    <h2>What we stand for</h2>
    <div class="info-grid">
      <div class="info-card"><h3>Fair prices</h3><p>Honest, everyday pricing with genuine discounts — no inflated “fake MRP” games.</p></div>
      <div class="info-card"><h3>Quality first</h3><p>Products are checked for quality before they reach your doorstep.</p></div>
      <div class="info-card"><h3>Support local</h3><p>We showcase Indian artisans and handicrafts alongside leading brands.</p></div>
      <div class="info-card"><h3>Customer care</h3><p>Friendly 24×7 support and a no-fuss 7-day return promise.</p></div>
    </div>` },
  careers: { title:'Careers at AJ SHOP', lead:'Help us build India’s friendliest marketplace.', html:`
    <div class="info-card"><p>We’re a small, fast-moving team that loves solving everyday problems for shoppers. If you’re curious, kind and take ownership, you’ll fit right in.</p></div>
    <h2>Open roles</h2>
    <div class="info-grid">
      <div class="info-card"><h3>Frontend Engineer</h3><p>Bengaluru / Remote · Build delightful, fast shopping experiences.</p></div>
      <div class="info-card"><h3>Catalog Associate</h3><p>Delhi · Curate products, photography and descriptions.</p></div>
      <div class="info-card"><h3>Customer Support Lead</h3><p>Remote · Own the post-purchase experience end to end.</p></div>
      <div class="info-card"><h3>Warehouse Operations</h3><p>Mumbai · Pick, pack and dispatch with speed and care.</p></div>
    </div>
    <p>Interested? Write to us at <b>careers@ajshop.example</b> with your CV and the role you’re excited about.</p>` },
  sell: { title:'Sell on AJ SHOP', lead:'Reach customers across India.', html:`
    <div class="info-card"><p>Grow your business by listing your products on AJ SHOP. Whether you’re a brand, a reseller or an artisan, we make selling online simple.</p></div>
    <h2>How it works</h2>
    <div class="info-grid">
      <div class="info-card"><h3>1 · Register</h3><p>Sign up with your GST and bank details in minutes.</p></div>
      <div class="info-card"><h3>2 · List</h3><p>Add your products, photos and prices to the catalog.</p></div>
      <div class="info-card"><h3>3 · Sell</h3><p>Receive orders and hand parcels to our logistics partners.</p></div>
      <div class="info-card"><h3>4 · Get paid</h3><p>Secure, on-time settlements to your bank account.</p></div>
    </div>
    <p>To become a seller, email <b>sellers@ajshop.example</b>.</p>` },
  contact: { title:'Contact Us', lead:'We’d love to hear from you.', html:`
    <div class="info-grid">
      <div class="info-card"><h3>Customer Support</h3><p>📧 support@ajshop.example<br>📞 1800-000-000 (toll-free)<br>🕑 Mon–Sun, 9am–9pm IST</p></div>
      <div class="info-card"><h3>Registered Office</h3><p>AJ SHOP<br>123 Market Road<br>New Delhi 110001, India</p></div>
    </div>
    <div class="info-card"><h2 style="margin-top:0">Send a message</h2>
      <div class="form-grid">
        <div class="field"><label>Your name</label><input placeholder="Full name"></div>
        <div class="field"><label>Email</label><input type="email" placeholder="you@example.com"></div>
        <div class="field full"><label>Message</label><textarea rows="4" placeholder="How can we help?"></textarea></div>
      </div>
      <button class="btn btn-primary" style="margin-top:14px" onclick="AJ.toast('Thanks! Our team will get back to you.')">Send Message</button>
    </div>` },
  shipping: { title:'Shipping & Delivery', lead:'Fast, reliable, pan-India delivery.', html:`
    <div class="info-card"><ul>
      <li><b>Free shipping</b> on all orders over ₹999. Orders below ₹999 carry a flat ₹79 delivery fee.</li>
      <li><b>Delivery time:</b> typically 3–6 business days depending on your PIN code.</li>
      <li><b>Tracking:</b> you’ll receive an SMS and email with a tracking link once your order ships.</li>
      <li><b>Serviceability:</b> enter your PIN code at the top of any page to confirm we deliver to you.</li>
      <li><b>Cash on Delivery</b> is available on eligible orders and PIN codes.</li>
    </ul></div>` },
  returns: { title:'Returns & Refunds', lead:'Easy 7-day returns.', html:`
    <div class="info-card"><ul>
      <li><b>7-day returns</b> from the date of delivery on most items.</li>
      <li>Items must be unused, in original packaging and with tags intact.</li>
      <li>Some categories (innerwear, beauty items with broken seals, personalised goods) are non-returnable for hygiene and safety reasons.</li>
      <li><b>Refunds</b> are processed to your original payment method within 5–7 business days after the return is received and checked.</li>
      <li>To start a return, go to <i>My Orders</i> and select <i>Return / Replace</i>.</li>
    </ul></div>` },
  privacy: { title:'Privacy Policy', lead:'Your data, handled with care.', html:`
    <div class="info-card">
    <p>This Privacy Policy explains how AJ SHOP collects, uses and protects your information. <i>(Sample content — replace with your reviewed legal policy before going live.)</i></p>
    <h2>Information we collect</h2><p>Contact details, delivery address, order history and device information needed to process orders and improve your experience.</p>
    <h2>Payments</h2><p>Card, UPI and net-banking payments are processed securely by <b>CCAvenue</b>. AJ SHOP does not store your full card details on its servers.</p>
    <h2>How we use it</h2><p>To fulfil orders, provide support, prevent fraud and — with your consent — send offers you can opt out of anytime.</p>
    <h2>Your rights</h2><p>You can request access, correction or deletion of your data by writing to privacy@ajshop.example.</p></div>` },
  terms: { title:'Terms of Use', lead:'The rules of the road.', html:`
    <div class="info-card">
    <p>By using AJ SHOP you agree to these Terms. <i>(Sample content — replace with your reviewed legal terms before going live.)</i></p>
    <h2>Orders & pricing</h2><p>All prices are in INR and inclusive of applicable taxes unless stated otherwise. We may cancel orders in case of pricing errors or stock issues, with a full refund.</p>
    <h2>Accounts</h2><p>You are responsible for keeping your account secure and for activity under it.</p>
    <h2>Acceptable use</h2><p>Don’t misuse the platform, attempt fraud or infringe others’ rights.</p>
    <h2>Liability</h2><p>Our liability is limited to the value of the order in question, to the extent permitted by law.</p></div>` },
  help: { title:'Help Centre', lead:'Answers to common questions.', html:`
    <div class="info-card"><h2 style="margin-top:0">Popular topics</h2><ul>
      <li><a style="color:var(--brand)" href="page.html?topic=track">Where is my order?</a></li>
      <li><a style="color:var(--brand)" href="page.html?topic=returns">How do returns and refunds work?</a></li>
      <li><a style="color:var(--brand)" href="page.html?topic=shipping">Shipping charges and delivery times</a></li>
      <li><a style="color:var(--brand)" href="page.html?topic=contact">Contact customer support</a></li>
    </ul></div>` },
  track: { title:'Track Your Order', lead:'Enter your order ID to see its status.', html:`
    <div class="info-card"><div class="form-grid"><div class="field full"><label>Order ID</label><input placeholder="e.g. AJ7F3K2Q9"></div></div>
    <button class="btn btn-primary" style="margin-top:12px" onclick="AJ.toast('Order tracking is a demo in this build.')">Track Order</button>
    <p style="margin-top:14px;color:var(--muted)">You’ll also get a tracking link by SMS and email once your order ships.</p></div>` },
  account: { title:'Sign in to AJ SHOP', lead:'Access your orders, wishlist and addresses.', html:`
    <div class="info-card" style="max-width:420px">
      <div class="field" style="margin-bottom:14px"><label>Mobile number or email</label><input placeholder="Enter mobile or email"></div>
      <div class="field" style="margin-bottom:14px"><label>Password</label><input type="password" placeholder="Password"></div>
      <button class="btn btn-primary btn-block" onclick="AJ.toast('Accounts are a demo in this build.')">Sign in</button>
      <p style="margin-top:14px;color:var(--muted);font-size:14px">New to AJ SHOP? <a style="color:var(--brand)" href="page.html?topic=account">Create an account</a></p>
    </div>` }
};
const topic = new URLSearchParams(location.search).get('topic') || 'about';
const pg = PAGES[topic] || PAGES.about;
document.title = pg.title + ' — AJ SHOP';
document.getElementById('crumbNow').textContent = pg.title;
document.getElementById('page').innerHTML = `<h1>${pg.title}</h1><p class="info-lead">${pg.lead}</p>${pg.html}`;
</script>
</body>
</html>
