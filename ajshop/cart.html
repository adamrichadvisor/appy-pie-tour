<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cart — AJ SHOP</title>
<link rel="icon" href="assets/img/logo.svg">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="site-header"></div>

<main class="wrap">
  <nav class="crumb"><a href="index.html">Home</a><span>›</span><span>Cart</span></nav>
  <h1 style="margin:16px 0 4px">Your Shopping Cart</h1>

  <div class="cart-layout">
    <div id="cartItems"></div>
    <aside class="summary" id="summary"></aside>
  </div>
</main>

<div id="site-footer"></div>

<script src="assets/js/art.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
  AJ.mount();
  let coupon = '';

  window.renderCartPage = function () {
    const t = AJ.cartTotals(coupon);
    const items = document.getElementById('cartItems');
    const summary = document.getElementById('summary');

    if (!t.items.length) {
      items.innerHTML = `<div class="empty">
        <svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>
        <h3>Your cart is empty</h3><p>Looks like you haven't added anything yet.</p>
        <a class="btn btn-primary" href="index.html" style="margin-top:16px">Start Shopping</a></div>`;
      summary.style.display = 'none';
      return;
    }
    summary.style.display = 'block';

    items.innerHTML = t.items.map(i => `
      <div class="cart-item">
        <div class="ci-img">${AJ.media(i.product)}</div>
        <div>
          <div class="ci-title">${i.product.name}</div>
          <div class="ci-meta">${AJ.catName(i.product.cat)}${i.variant?' · '+i.variant:''}</div>
          <div class="qty" style="transform:scale(.9);transform-origin:left">
            <button data-act="dec" data-key="${i.key}">−</button><span>${i.qty}</span><button data-act="inc" data-key="${i.key}">+</button>
          </div>
        </div>
        <div class="ci-right">
          <div class="ci-price">${AJ.money(i.lineTotal)}</div>
          <button class="ci-remove" data-act="rm" data-key="${i.key}">
            <svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2m-9 0v14a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V6"/></svg> Remove</button>
        </div>
      </div>`).join('');

    summary.innerHTML = `
      <h3>Order Summary</h3>
      <div class="sum-row"><span>Price (${t.items.reduce((s,i)=>s+i.qty,0)} items)</span><span>${AJ.money(t.mrpTotal)}</span></div>
      <div class="sum-row"><span>Product discount</span><span style="color:var(--ok)">− ${AJ.money(t.saved)}</span></div>
      ${t.discount?`<div class="sum-row"><span>Coupon (${coupon})</span><span style="color:var(--ok)">− ${AJ.money(t.discount)}</span></div>`:''}
      <div class="sum-row"><span>Delivery</span><span>${t.shipping?AJ.money(t.shipping):'<span style="color:var(--ok)">FREE</span>'}</span></div>
      <div class="coupon">
        <input id="couponInput" placeholder="Coupon: AJ10 or WELCOME200" value="${coupon}">
        <button class="btn btn-dark" id="applyCoupon" style="height:44px">Apply</button>
      </div>
      <div class="sum-row total"><span>Total Payable</span><span>${AJ.money(t.total)}</span></div>
      <div class="deliver-strip" id="cartDeliver" style="margin:14px 0 4px"></div>
      <button class="btn btn-primary btn-block" id="proceedBtn" style="margin-top:12px">Proceed to Checkout</button>
      <p style="text-align:center;color:var(--ok);font-size:13px;margin-top:12px">🎉 You save ${AJ.money(t.saved + t.discount)} on this order</p>`;

    document.getElementById('applyCoupon').onclick = () => {
      const v = document.getElementById('couponInput').value.trim().toUpperCase();
      if (v && v!=='AJ10' && v!=='WELCOME200') { AJ.toast('Invalid coupon code'); return; }
      coupon = v;
      if (v) AJ.toast('Coupon applied ✓');
      renderCartPage();
    };

    // delivery location strip + gated checkout
    function renderDeliver() {
      const loc = AJ.getLocation();
      document.getElementById('cartDeliver').innerHTML = loc
        ? `<svg viewBox="0 0 24 24"><path d="M12 21s-7-6.3-7-11a7 7 0 0 1 14 0c0 4.7-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg> Deliver to <b>${loc.city} — ${loc.pin}</b><button data-act="open-location">Change</button>`
        : `<svg viewBox="0 0 24 24"><path d="M12 21s-7-6.3-7-11a7 7 0 0 1 14 0c0 4.7-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg> Select delivery location to continue<button data-act="open-location">Select</button>`;
    }
    renderDeliver();
    document.getElementById('proceedBtn').onclick = () => AJ.requireLocation(() => { location.href = 'checkout.html'; });
    document.addEventListener('click', (e) => { if (e.target.closest('[data-act="save-location"],[data-act="open-location"]')) setTimeout(renderDeliver, 60); });
  };
  renderCartPage();
</script>
</body>
</html>
